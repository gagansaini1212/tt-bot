name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The database tests create, migrate and drop their own databases here.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # Before the build, which also writes Next's route types, so this proves
      # `pnpm check` works on a fresh checkout.
      - run: pnpm check

      - run: pnpm build

      # Twice each, to prove both are safe to run again.
      - name: Migrate and seed a database
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_URL: postgresql://trading_local:trading_local@localhost:5432/postgres
        run: |
          pnpm db:migrate
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed

      - run: pnpm test

      - run: pnpm --filter @crypto-trading/web lint
